version: 2

# Publish source code
source:
  enabled: true

# Build release binaries and inject the semantic-release version.
builds:
  - id: policy-scout
    main: .
    binary: policy-scout
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ariguillegp/policy-scout/cmd.version={{.Version}}

# Generate changelog
changelog:
  use: github
  filters:
    exclude:
      - "^test"
